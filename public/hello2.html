<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hello world 2</title>
  </head>
  <body>
    <h1>Hello world 2 !</h1>
    <p id="message">Chargement…</p>
    <script>
      fetch('/api/hello')
        .then((res) => res.json())
        .then((data) => {
          document.getElementById('message').textContent = data.message;
        })
        .catch(() => {
          document.getElementById('message').textContent = 'Serveur injoignable.';
        });
    </script>
  </body>
</html>
